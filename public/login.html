<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — DimsumKu</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d2d57,#1d5da9);font-family:Arial;color:#16335b}.box{width:min(410px,92vw);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0004}.logo{width:62px;height:62px;background:#ffd447;border-radius:50%;display:grid;place-items:center;font-size:31px;margin:auto}.title{text-align:center;margin:12px 0 4px}.sub{text-align:center;color:#74839a;margin:0 0 25px}.form{display:grid;gap:12px}.form label{font-weight:bold;font-size:13px}.form input{width:100%;padding:12px;border:1px solid #d3deeb;border-radius:8px;margin-top:6px}.btn{border:0;background:#1769df;color:#fff;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}.hint{text-align:center;color:#8290a5;font-size:12px;margin-top:15px}.err{color:#d94c4c;text-align:center;font-size:13px;min-height:18px}
</style></head><body><div class="box"><div class="logo">🥟</div><h2 class="title">DimsumKu</h2><p class="sub">Sistem Cash Flow & HPP Usaha Dimsum</p><form class="form" id="f"><label>Username<input id="u" value="admin"></label><label>Password<input id="p" type="password" value="admin123"></label><div class="err" id="e"></div><button class="btn">Masuk</button></form><div class="hint">Login demo: admin / admin123</div></div>
<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href='/';else document.getElementById('e').textContent=(await r.json()).error}</script></body></html>
